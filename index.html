<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>cbrbrod - بوت إرسال الرسائل</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2d1b3d 0%, #1a0f2e 50%, #0d0520 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: linear-gradient(135deg, #3d2557 0%, #2a1b3d 100%);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 100%;
            max-width: 700px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(138, 92, 192, 0.4);
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #9b59b6;
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.4);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header h1 {
            color: #b794f6;
            font-size: 2rem;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .header p {
            color: #9575cd;
            font-size: 1.1rem;
        }

        .discord-btn {
            display: inline-block;
            background: linear-gradient(135deg, #7289da 0%, #5b6eae 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin: 15px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(114, 137, 218, 0.3);
        }

        .discord-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(114, 137, 218, 0.5);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #b794f6;
            font-weight: 600;
            font-size: 1rem;
        }
        
        input, textarea, select, button {
            width: 100%;
            padding: 16px;
            border: 2px solid #5a3d7a;
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #2a1b3d;
            color: #d4c5f9;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #9b59b6;
            box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.3);
        }
        
        textarea {
            height: 140px;
            resize: vertical;
            font-family: inherit;
        }
        
        .btn {
            background: linear-gradient(135deg, #9b59b6 0%, #6c3483 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(155, 89, 182, 0.4);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn.secondary {
            background: linear-gradient(135deg, #af7ac5 0%, #9b59b6 100%);
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        
        .btn-group .btn {
            flex: 1;
            margin-top: 0;
        }
        
        .filters-section {
            background: #2a1b3d;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: none;
            border: 2px solid #5a3d7a;
        }

        .filters-section h3 {
            color: #b794f6;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .filter-group {
            flex: 1;
        }
        
        .guild-selector {
            background: #2a1b3d;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: none;
            border: 2px solid #5a3d7a;
        }

        .guild-selector h3 {
            color: #b794f6;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .guild-item {
            display: flex;
            align-items: center;
            padding: 18px;
            margin: 12px 0;
            background: #3d2557;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .guild-item:hover {
            border-color: #9b59b6;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }
        
        .guild-item.selected {
            border-color: #b794f6;
            background: #5a3d7a;
        }
        
        .guild-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-left: 15px;
            background: linear-gradient(135deg, #9b59b6 0%, #6c3483 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
        }
        
        .guild-info {
            flex: 1;
        }
        
        .guild-name {
            font-weight: 600;
            color: #d4c5f9;
            font-size: 1.1rem;
        }
        
        .stats {
            background: #2a1b3d;
            padding: 25px;
            border-radius: 15px;
            margin-top: 25px;
            display: none;
            border: 2px solid #5a3d7a;
        }
        
        .stats h3 {
            color: #b794f6;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 12px 0;
            border-bottom: 2px solid #5a3d7a;
        }
        
        .stat-label {
            font-weight: 600;
            color: #9575cd;
        }
        
        .stat-value {
            font-weight: bold;
            color: #b794f6;
            font-size: 1.1rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 25px 0;
            color: #b794f6;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #9b59b6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .success { background: #2d5016; color: #a5d6a7; border: 2px solid #4caf50; }
        .error { background: #5c1a1a; color: #ef9a9a; border: 2px solid #f44336; }
        .info { background: #1a3a5c; color: #90caf9; border: 2px solid #2196f3; }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 25px;
                border-radius: 20px;
            }
            
            .header h1 {
                font-size: 1.6rem;
            }

            .logo {
                width: 100px;
                height: 100px;
            }
            
            .filter-row {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="https://cdn.discordapp.com/attachments/1445129696575754422/1447645230533710037/e9ff5a74703efd10.png?ex=6938602e&is=69370eae&hm=91e7f7581d646922b143d5ea611f1b26e810bed8e307fbb3dc575910e2a726f6&" alt="cbrbrod">
            </div>
            <h1>cbrbrod</h1>
            <p>بوت إرسال الرسائل ( برود كاست )</p>
            <a href="https://discord.gg/mjf4J8ux45" target="_blank" class="discord-btn">سيرفرنا بالديسكورد</a>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div class="form-group">
            <label for="botToken">توكن البوت:</label>
            <input type="password" id="botToken" placeholder="حط توكن البوت هنا..." required>
            <div class="btn-group">
                <button class="btn secondary" onclick="testConnection()">
                    اختبار الاتصال
                </button>
                <button class="btn" onclick="getGuilds()">
                    عرض السيرفرات
                </button>
            </div>
        </div>

        <div id="guildSelector" class="guild-selector">
            <h3>اختر السيرفر:</h3>
            <div id="guildsList"></div>
        </div>

        <div id="filtersSection" class="filters-section">
            <h3>الفلاتر:</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label for="roleFilter">الرتبة:</label>
                    <select id="roleFilter" onchange="updateSendButton()">
                        <option value="all">كل الرتب</option>
                    </select>
                </div>
            </div>
            <button class="btn secondary" onclick="getRoles()">
                تحديث الرتب
            </button>
        </div>

        <div class="form-group">
            <label for="message">الرسالة:</label>
            <textarea id="message" placeholder="اكتب الرسالة اللي تبي ترسلها..." required></textarea>
        </div>

        <div class="form-group">
            <label for="delay">الوقت بين كل رسالة (ثانية):</label>
            <input type="number" id="delay" value="2" min="0.25" max="15" step="0.25" required>
        </div>

        <button class="btn" id="sendBtn" onclick="sendMessages()" disabled>
            إرسال الرسائل (اختر سيرفر أول)
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">قاعد يرسل... لا تسكر الصفحة</p>
        </div>

        <div class="stats" id="stats">
            <h3>إحصائيات الإرسال</h3>
            <div class="stat-item">
                <span class="stat-label">السيرفر:</span>
                <span class="stat-value" id="currentGuild">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">انرسل:</span>
                <span class="stat-value" id="sentCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ما انرسل:</span>
                <span class="stat-value" id="failedCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">المجموع:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://brod-bot.onrender.com';
        
        let selectedGuild = null;
        let currentRoles = [];

        async function testConnection() {
            showAlert('قاعد يختبر الاتصال...', 'info');
            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/test');
                const data = await response.json();
                showAlert('تمام، الاتصال شغال: ' + data.message, 'success');
            } catch (error) {
                showAlert('في مشكلة بالاتصال: ' + error.message, 'error');
            }
        }

        async function getGuilds() {
            const token = document.getElementById('botToken').value.trim();
            
            if (!token) {
                showAlert('حط التوكن أول', 'error');
                return;
            }

            showAlert('قاعد يجيب السيرفرات...', 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/get-guilds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ botToken: token })
                });

                const data = await response.json();

                if (data.success) {
                    displayGuilds(data.guilds);
                    showAlert('تمام، جبنا السيرفرات: ' + data.message, 'success');
                } else {
                    showAlert('في مشكلة: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('في مشكلة بالاتصال: ' + error.message, 'error');
            }
        }

        async function getRoles() {
            if (!selectedGuild) {
                showAlert('اختر سيرفر أول', 'error');
                return;
            }

            const token = document.getElementById('botToken').value.trim();
            
            showAlert('قاعد يجيب الرتب...', 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/get-roles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        botToken: token,
                        guildId: selectedGuild.id 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayRoles(data.roles);
                    showAlert('تمام، جبنا الرتب: ' + data.message, 'success');
                } else {
                    showAlert('في مشكلة: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('في مشكلة بجلب الرتب: ' + error.message, 'error');
            }
        }

        function displayGuilds(guilds) {
            const section = document.getElementById('guildSelector');
            const list = document.getElementById('guildsList');
            
            list.innerHTML = '';
            section.style.display = 'block';

            if (!guilds || guilds.length === 0) {
                list.innerHTML = '<div class="alert info">ما في سيرفرات</div>';
                return;
            }

            guilds.forEach(guild => {
                const div = document.createElement('div');
                div.className = 'guild-item';
                
                const guildName = guild.name || 'Unknown Guild';
                const firstChar = guildName.charAt(0).toUpperCase();
                
                div.innerHTML = '<div class="guild-icon">' + firstChar + '</div><div class="guild-info"><div class="guild-name">' + guildName + '</div></div>';
                
                div.onclick = function() { selectGuild(guild, div); };
                list.appendChild(div);
            });
        }

        function displayRoles(roles) {
            const roleSelect = document.getElementById('roleFilter');
            roleSelect.innerHTML = '<option value="all">كل الرتب</option>';
            
            currentRoles = roles || [];
            
            if (currentRoles.length > 0) {
                currentRoles.forEach(function(role) {
                    const option = document.createElement('option');
                    option.value = role.id;
                    option.textContent = role.name || 'Unknown Role';
                    roleSelect.appendChild(option);
                });
            }
        }

        function selectGuild(guild, element) {
            document.querySelectorAll('.guild-item').forEach(function(item) {
                item.classList.remove('selected');
            });
            
            element.classList.add('selected');
            selectedGuild = guild;
            
            document.getElementById('filtersSection').style.display = 'block';
            updateSendButton();
            document.getElementById('currentGuild').textContent = guild.name;
            showAlert('تمام، اخترت السيرفر: ' + guild.name, 'success');
            
            getRoles();
        }

        function updateSendButton() {
            const sendBtn = document.getElementById('sendBtn');
            if (selectedGuild) {
                sendBtn.disabled = false;
                sendBtn.textContent = 'إرسال لـ ' + selectedGuild.name;
            }
        }

        async function sendMessages() {
            if (!selectedGuild) {
                showAlert('اختر سيرفر أول', 'error');
                return;
            }

            const token = document.getElementById('botToken').value.trim();
            const message = document.getElementById('message').value.trim();
            const delay = document.getElementById('delay').value;
            const roleFilter = document.getElementById('roleFilter').value;

            if (!message) {
                showAlert('اكتب الرسالة', 'error');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const loading = document.getElementById('loading');
            const stats = document.getElementById('stats');
            
            sendBtn.disabled = true;
            loading.style.display = 'block';
            stats.style.display = 'block';

            document.getElementById('loadingText').textContent = 'قاعد يرسل لأعضاء: ' + selectedGuild.name;
            showAlert('بدينا نرسل لأعضاء: ' + selectedGuild.name, 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/send-messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        botToken: token,
                        message: message,
                        delay: parseFloat(delay),
                        guildId: selectedGuild.id,
                        roleId: roleFilter
                    })
                });

                const data = await response.json();

                if (data.success) {
                    updateStats(data.results.sent, data.results.failed, data.results.total);
                    showAlert('تمام، انرسل لـ ' + data.results.sent + ' عضو | ما انرسل لـ: ' + data.results.failed, 'success');
                } else {
                    showAlert('في مشكلة: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('في مشكلة بالإرسال: ' + error.message, 'error');
            } finally {
                sendBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function updateStats(sent, failed, total) {
            document.getElementById('sentCount').textContent = sent;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('totalCount').textContent = total;
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
            alert.style.display = 'block';
            
            setTimeout(function() {
                alert.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('load', function() {
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
