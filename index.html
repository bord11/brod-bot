<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>بوت إرسال الرسائل - Brod</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            color: #8A2BE2;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #666;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        input, textarea, select, button {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8A2BE2;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.1);
        }
        
        textarea {
            height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        
        .btn {
            background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.3);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn.secondary {
            background: linear-gradient(135deg, #9370DB 0%, #8A2BE2 100%);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-group .btn {
            flex: 1;
            margin-top: 0;
        }
        
        .filters-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        
        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .filter-group {
            flex: 1;
        }
        
        .guild-selector {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        
        .guild-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .guild-item:hover {
            border-color: #8A2BE2;
        }
        
        .guild-item.selected {
            border-color: #9C27B0;
            background: #f3e5f5;
        }
        
        .guild-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-left: 15px;
            background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .guild-info {
            flex: 1;
        }
        
        .guild-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }
        
        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        
        .stats h3 {
            color: #8A2BE2;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #e1e5e9;
        }
        
        .stat-label {
            font-weight: 600;
            color: #555;
        }
        
        .stat-value {
            font-weight: bold;
            color: #8A2BE2;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8A2BE2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        
        .success { background: #e8f5e8; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .info { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 20px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .filter-row {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 بوت إرسال الرسائل - Brod</h1>
            <p>أرسل رسائل تلقائية مع فلاتر متقدمة</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div class="form-group">
            <label for="botToken">🔑 توكن البوت:</label>
            <input type="password" id="botToken" placeholder="أدخل توكن البوت هنا..." required>
            <div class="btn-group">
                <button class="btn secondary" onclick="testConnection()">
                    🔧 اختبار الاتصال
                </button>
                <button class="btn" onclick="getGuilds()">
                    🔍 عرض السيرفرات
                </button>
            </div>
        </div>

        <div id="guildSelector" class="guild-selector">
            <h3>🏠 اختر السيرفر:</h3>
            <div id="guildsList"></div>
        </div>

        <div id="filtersSection" class="filters-section">
            <h3>🎛️ الفلاتر المتقدمة:</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label for="roleFilter">👑 الرتبة:</label>
                    <select id="roleFilter" onchange="updateSendButton()">
                        <option value="all">جميع الرتب</option>
                    </select>
                </div>
            </div>
            <button class="btn secondary" onclick="getRoles()">
                🔄 تحديث الرتب
            </button>
        </div>

        <div class="form-group">
            <label for="message">💬 الرسالة:</label>
            <textarea id="message" placeholder="اكتب الرسالة التي تريد إرسالها..." required></textarea>
        </div>

        <div class="form-group">
            <label for="delay">⏰ الوقت بين كل رسالة (ثانية):</label>
            <input type="number" id="delay" value="2" min="0.25" max="15" step="0.25" required>
        </div>

        <button class="btn" id="sendBtn" onclick="sendMessages()" disabled>
            🚀 إرسال الرسائل (اختر سيرفر أولاً)
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">جاري الإرسال... لا تغلق الصفحة</p>
        </div>

        <div class="stats" id="stats">
            <h3>📊 إحصائيات الإرسال</h3>
            <div class="stat-item">
                <span class="stat-label">🏠 السيرفر:</span>
                <span class="stat-value" id="currentGuild">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">✅ تم الإرسال:</span>
                <span class="stat-value" id="sentCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">❌ فشل الإرسال:</span>
                <span class="stat-value" id="failedCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">👥 الإجمالي:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
        </div>
    </div>

    <script>
        // 🔗 رابط السيرفر - راح يتغير بعد النشر
        const API_BASE = '';
        
        let selectedGuild = null;
        let currentRoles = [];

        async function testConnection() {
            showAlert('🔧 جاري اختبار الاتصال...', 'info');
            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/test');
                const data = await response.json();
                showAlert('✅ ' + data.message, 'success');
            } catch (error) {
                showAlert('❌ خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function getGuilds() {
            const token = document.getElementById('botToken').value.trim();
            
            if (!token) {
                showAlert('❌ أدخل توكن البوت أولاً', 'error');
                return;
            }

            showAlert('🔍 جاري جلب السيرفرات...', 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/get-guilds', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ botToken: token })
                });

                const data = await response.json();

                if (data.success) {
                    displayGuilds(data.guilds);
                    showAlert('✅ ' + data.message, 'success');
                } else {
                    showAlert('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('❌ خطأ في الاتصال: ' + error.message, 'error');
            }
        }

        async function getRoles() {
            if (!selectedGuild) {
                showAlert('❌ اختر سيرفر أولاً', 'error');
                return;
            }

            const token = document.getElementById('botToken').value.trim();
            
            showAlert('👑 جاري جلب الرتب...', 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/get-roles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        botToken: token,
                        guildId: selectedGuild.id 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayRoles(data.roles);
                    showAlert('✅ ' + data.message, 'success');
                } else {
                    showAlert('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('❌ خطأ في جلب الرتب: ' + error.message, 'error');
            }
        }

        function displayGuilds(guilds) {
            const section = document.getElementById('guildSelector');
            const list = document.getElementById('guildsList');
            
            list.innerHTML = '';
            section.style.display = 'block';

            if (!guilds || guilds.length === 0) {
                list.innerHTML = '<div class="alert info">لا توجد سيرفرات</div>';
                return;
            }

            guilds.forEach(guild => {
                const div = document.createElement('div');
                div.className = 'guild-item';
                
                const guildName = guild.name || 'Unknown Guild';
                const firstChar = guildName.charAt(0).toUpperCase();
                
                div.innerHTML = '<div class="guild-icon">' + firstChar + '</div><div class="guild-info"><div class="guild-name">' + guildName + '</div></div>';
                
                div.onclick = function() { selectGuild(guild, div); };
                list.appendChild(div);
            });
        }

        function displayRoles(roles) {
            const roleSelect = document.getElementById('roleFilter');
            roleSelect.innerHTML = '<option value="all">جميع الرتب</option>';
            
            currentRoles = roles || [];
            
            if (currentRoles.length > 0) {
                currentRoles.forEach(function(role) {
                    const option = document.createElement('option');
                    option.value = role.id;
                    option.textContent = role.name || 'Unknown Role';
                    roleSelect.appendChild(option);
                });
            }
        }

        function selectGuild(guild, element) {
            document.querySelectorAll('.guild-item').forEach(function(item) {
                item.classList.remove('selected');
            });
            
            element.classList.add('selected');
            selectedGuild = guild;
            
            document.getElementById('filtersSection').style.display = 'block';
            updateSendButton();
            document.getElementById('currentGuild').textContent = guild.name;
            showAlert('✅ تم اختيار سيرفر: ' + guild.name, 'success');
            
            getRoles();
        }

        function updateSendButton() {
            const sendBtn = document.getElementById('sendBtn');
            if (selectedGuild) {
                sendBtn.disabled = false;
                sendBtn.textContent = '🚀 إرسال إلى ' + selectedGuild.name;
            }
        }

        async function sendMessages() {
            if (!selectedGuild) {
                showAlert('❌ اختر سيرفر أولاً', 'error');
                return;
            }

            const token = document.getElementById('botToken').value.trim();
            const message = document.getElementById('message').value.trim();
            const delay = document.getElementById('delay').value;
            const roleFilter = document.getElementById('roleFilter').value;

            if (!message) {
                showAlert('❌ اكتب الرسالة', 'error');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const loading = document.getElementById('loading');
            const stats = document.getElementById('stats');
            
            sendBtn.disabled = true;
            loading.style.display = 'block';
            stats.style.display = 'block';

            document.getElementById('loadingText').textContent = 'جاري الإرسال إلى أعضاء سيرفر: ' + selectedGuild.name;
            showAlert('🚀 بدء الإرسال إلى أعضاء سيرفر: ' + selectedGuild.name, 'info');

            try {
                const baseUrl = API_BASE || window.location.origin;
                const response = await fetch(baseUrl + '/api/send-messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        botToken: token,
                        message: message,
                        delay: parseFloat(delay),
                        guildId: selectedGuild.id,
                        roleId: roleFilter
                    })
                });

                const data = await response.json();

                if (data.success) {
                    updateStats(data.results.sent, data.results.failed, data.results.total);
                    showAlert('✅ تم الإرسال إلى ' + data.results.sent + ' عضو | فشل: ' + data.results.failed, 'success');
                } else {
                    showAlert('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('❌ خطأ في الإرسال: ' + error.message, 'error');
            } finally {
                sendBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function updateStats(sent, failed, total) {
            document.getElementById('sentCount').textContent = sent;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('totalCount').textContent = total;
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert ' + type;
            alert.style.display = 'block';
            
            setTimeout(function() {
                alert.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('load', function() {
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
